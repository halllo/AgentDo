# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Publish to NuGet

on:
  push:
    branches: [ "main" ]
    paths:
      - 'AgentDo/**'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: |
        git fetch --unshallow

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ./AgentDo/AgentDo.csproj

    - name: Build
      run: dotnet build ./AgentDo/AgentDo.csproj /p:Version=${{ steps.gitversion.outputs.majorMinorPatch }} --configuration Release --no-restore

    # Nothing gets published without passing the tests that cost nothing to run.
    # The billed categories (Bedrock, OpenAI) and the ones needing a local model server
    # are excluded; they need credentials this workflow deliberately does not have.
    - name: Test (offline only)
      run: dotnet test ./AgentDo.Tests/AgentDo.Tests.csproj --configuration Release --filter "TestCategory!=Bedrock&TestCategory!=OpenAI&TestCategory!=LocalLlm"

    - name: Pack
      run: dotnet pack ./AgentDo/AgentDo.csproj /p:PackageVersion=${{ steps.gitversion.outputs.semVer }} --no-restore --configuration Release --output nupkgs

    - name: Push to NuGet
      run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
